stages:
  simulate:
    cmd: python -m src.simulation.simulator --config configs/simulation.yaml --overwrite
    deps:
      - configs/simulation.yaml
      - src/simulation/scenarios.py
      - src/simulation/simulator.py
    outs:
      - data/raw/synthetic
  synthetic_validate:
    cmd: python -m src.data.synthetic_validation --data-dir data/raw/synthetic --output models/validation/synthetic_data_validation.json
    deps:
      - data/raw/synthetic
      - src/data/synthetic_validation.py
    outs:
      - models/validation/synthetic_data_validation.json
  clean:
    cmd: python -m src.data.cleaner --input-dir data/raw/oulad --output-dir data/processed/oulad
    deps:
      - data/raw/oulad
      - src/data/cleaner.py
      - src/data/loader.py
    outs:
      - data/processed/oulad
  train:
    cmd: python -m pipeline.training_pipeline --data-dir data/processed/oulad --metrics-output models/metrics/metrics.json --model-output models/baseline.pkl
    deps:
      - data/processed/oulad
      - pipeline/training_pipeline.py
      - src/features/feature_engineering.py
      - src/models/baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
    outs:
      - models/baseline.pkl
  early_warning:
    cmd: python -m pipeline.early_warning_pipeline --data-dir data/processed/oulad --metrics-output models/metrics/early_warning_metrics.json --cutoffs-days 30 60 90
    deps:
      - data/processed/oulad
      - pipeline/early_warning_pipeline.py
      - src/features/feature_engineering.py
      - src/models/baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
  synthetic_baseline:
    cmd: python -m pipeline.synthetic_baseline_pipeline --data-dir data/raw/synthetic --metrics-output models/metrics/synthetic_baseline_metrics.json --model-dir models/synthetic_baseline --cutoffs-days 30 60 90
    deps:
      - data/raw/synthetic
      - pipeline/synthetic_baseline_pipeline.py
      - src/features/synthetic_features.py
      - src/models/synthetic_baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
      - src/tracking/mlflow_tracking.py
    outs:
      - models/synthetic_baseline
    metrics:
      - models/metrics/synthetic_baseline_metrics.json
