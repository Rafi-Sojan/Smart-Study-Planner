stages:
  simulate:
    cmd: python -m src.simulation.simulator --config configs/simulation.yaml --overwrite
    deps:
      - configs/simulation.yaml
      - src/simulation/scenarios.py
      - src/simulation/simulator.py
    outs:
      - data/raw/synthetic
  synthetic_validate:
    cmd: python -m src.data.synthetic_validation --data-dir data/raw/synthetic --output artifacts/validation/synthetic_data_validation.json
    deps:
      - data/raw/synthetic
      - src/data/synthetic_validation.py
    outs:
      - artifacts/validation/synthetic_data_validation.json
  clean:
    cmd: python -m src.data.cleaner --input-dir data/raw/oulad --output-dir data/processed/oulad
    deps:
      - data/raw/oulad
      - src/data/cleaner.py
      - src/data/loader.py
    outs:
      - data/processed/oulad
  train:
    cmd: python -m pipeline.training_pipeline --data-dir data/processed/oulad --metrics-output artifacts/metrics/metrics.json --model-output artifacts/models/baseline.pkl
    deps:
      - data/processed/oulad
      - pipeline/training_pipeline.py
      - src/features/feature_engineering.py
      - src/models/baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
      - src/risk/model_risk.py
      - src/tracking/mlflow_tracking.py
    outs:
      - artifacts/models/baseline.pkl
    metrics:
      - artifacts/metrics/metrics.json
  early_warning:
    cmd: python -m pipeline.early_warning_pipeline --data-dir data/processed/oulad --metrics-output artifacts/metrics/early_warning_metrics.json --cutoffs-days 30 60 90
    deps:
      - data/processed/oulad
      - pipeline/early_warning_pipeline.py
      - src/features/feature_engineering.py
      - src/models/baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
      - src/risk/model_risk.py
      - src/tracking/mlflow_tracking.py
    metrics:
      - artifacts/metrics/early_warning_metrics.json
  kuleuven_external_validation:
    cmd: python -m pipeline.kuleuven_external_validation --data-path data/raw/external/kuleuven/dataset.zip --metrics-output artifacts/metrics/kuleuven_external_metrics.json --cutoffs-days 30 60 90
    deps:
      - data/raw/external/kuleuven/dataset.zip
      - pipeline/kuleuven_external_validation.py
      - src/data/kuleuven.py
      - src/models/baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
    outs:
      - artifacts/metrics/kuleuven_external_metrics.json
  cross_dataset_transfer:
    cmd: python -m pipeline.cross_dataset_transfer --kuleuven-path data/raw/external/kuleuven/dataset.zip --synthetic-path data/raw/synthetic --metrics-output artifacts/metrics/cross_dataset_transfer_metrics.json --cutoffs-days 30 60 90
    deps:
      - data/raw/external/kuleuven/dataset.zip
      - data/raw/synthetic
      - pipeline/cross_dataset_transfer.py
      - pipeline/kuleuven_external_validation.py
      - src/data/kuleuven.py
      - src/data/transfer.py
      - src/models/baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
    outs:
      - artifacts/metrics/cross_dataset_transfer_metrics.json
  synthetic_baseline:
    cmd: python -m pipeline.synthetic_baseline_pipeline --data-dir data/raw/synthetic --metrics-output artifacts/metrics/synthetic_baseline_metrics.json --model-dir artifacts/models/synthetic_baseline --cutoffs-days 30 60 90
    deps:
      - data/raw/synthetic
      - pipeline/synthetic_baseline_pipeline.py
      - src/features/synthetic_features.py
      - src/models/synthetic_baseline.py
      - src/models/evaluate.py
      - src/models/policy.py
      - src/tracking/mlflow_tracking.py
      - src/risk/model_risk.py
    outs:
      - artifacts/models/synthetic_baseline
    metrics:
      - artifacts/metrics/synthetic_baseline_metrics.json
  model_quality:
    cmd: python -m pipeline.model_quality_suite --config configs/model-quality.yaml --output-dir artifacts/validation/model_quality
    deps:
      - artifacts/metrics/metrics.json
      - artifacts/metrics/early_warning_metrics.json
      - artifacts/metrics/synthetic_baseline_metrics.json
      - configs/model-quality.yaml
      - pipeline/model_quality_suite.py
      - src/risk/model_risk.py
    outs:
      - artifacts/validation/model_quality
  oulad_statistical_validation:
    cmd: python -m pipeline.statistical_validation oulad --data-dir data/processed/oulad --kuleuven-path data/raw/external/kuleuven/dataset.zip --early-warning-metrics artifacts/metrics/early_warning_metrics.json --kuleuven-metrics artifacts/metrics/kuleuven_external_metrics.json --output artifacts/validation/oulad_statistical_validation.json --cutoffs 30 60 90
    deps:
      - data/processed/oulad
      - data/raw/external/kuleuven/dataset.zip
      - artifacts/metrics/early_warning_metrics.json
      - artifacts/metrics/kuleuven_external_metrics.json
      - pipeline/statistical_validation.py
      - src/data/kuleuven.py
      - src/features/feature_engineering.py
      - src/validation/statistical.py
    outs:
      - artifacts/validation/oulad_statistical_validation.json
  synthetic_statistical_validation:
    cmd: python -m pipeline.statistical_validation synthetic --data-dir data/raw/synthetic --oulad-dir data/processed/oulad --kuleuven-path data/raw/external/kuleuven/dataset.zip --synthetic-metrics artifacts/metrics/synthetic_baseline_metrics.json --oulad-metrics artifacts/metrics/early_warning_metrics.json --kuleuven-metrics artifacts/metrics/kuleuven_external_metrics.json --output artifacts/validation/synthetic_statistical_validation.json --cutoffs 30 60 90
    deps:
      - data/raw/synthetic
      - data/processed/oulad
      - data/raw/external/kuleuven/dataset.zip
      - artifacts/metrics/synthetic_baseline_metrics.json
      - artifacts/metrics/early_warning_metrics.json
      - artifacts/metrics/kuleuven_external_metrics.json
      - pipeline/statistical_validation.py
      - src/data/kuleuven.py
      - src/data/synthetic_validation.py
      - src/data/transfer.py
      - src/features/synthetic_features.py
      - src/validation/statistical.py
    outs:
      - artifacts/validation/synthetic_statistical_validation.json
