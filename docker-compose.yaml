services:
  api:
    build:
      context: .
    container_name: smart-study-planner-api
    restart: unless-stopped
    environment:
      MODEL_PATH: ${MODEL_PATH:-}
      MODEL_URI: ${MODEL_URI:-}
      MODEL_VERSION: ${MODEL_VERSION:-local}
      MODEL_SHA256: ${MODEL_SHA256:-}
      ALLOW_TRUSTED_PICKLE_MODEL: ${ALLOW_TRUSTED_PICKLE_MODEL:-1}
      API_KEY: ${API_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
    volumes:
      - ./models/pretrained:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smart-study-planner-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: smart-study-planner-pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smart-study-planner-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting Grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
