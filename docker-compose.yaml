services:
  api:
    build:
      context: .
    container_name: smart-study-planner-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      MODEL_PATH: ${MODEL_PATH:-}
      MODEL_URI: ${MODEL_URI:-}
      MODEL_VERSION: ${MODEL_VERSION:-local}
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.5}
      MODEL_SHA256: ${MODEL_SHA256:-}
      MODEL_CATALOG_JSON: ${MODEL_CATALOG_JSON:-}
      DEFAULT_MODEL_ID: ${DEFAULT_MODEL_ID:-}
      MODEL_LABEL: ${MODEL_LABEL:-}
      MODEL_DESCRIPTION: ${MODEL_DESCRIPTION:-}
      MODEL_DATASET: ${MODEL_DATASET:-}
      MODEL_CUTOFF_DAYS: ${MODEL_CUTOFF_DAYS:-}
      ALLOW_TRUSTED_PICKLE_MODEL: ${ALLOW_TRUSTED_PICKLE_MODEL:-1}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      API_KEY: ${API_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,smart-study-planner-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      WEB_AUTH_USERNAME: ${WEB_AUTH_USERNAME:-}
      WEB_AUTH_PASSWORD_HASH: ${WEB_AUTH_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
    volumes:
      - ./artifacts/models/pretrained:/models:ro
      - ./artifacts/models:/model-store:ro
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - smart-study-planner-api

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smart-study-planner-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smart-study-planner-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: smart-study-planner-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: smart-study-planner-pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smart-study-planner-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting Grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
