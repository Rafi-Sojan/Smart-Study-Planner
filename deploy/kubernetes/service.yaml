apiVersion: v1
kind: Service
metadata:
  name: smart-study-planner-api
  labels:
    app.kubernetes.io/name: smart-study-planner-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smart-study-planner-api
  ports:
    - name: http
      port: 8000
      targetPort: http
