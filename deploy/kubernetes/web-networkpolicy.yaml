apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-study-planner-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-study-planner-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-study-planner-api
      ports:
        - protocol: TCP
          port: 8000
