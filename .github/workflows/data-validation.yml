name: Scheduled data and statistical validation

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-data-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure authenticated DVC remote
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DAGSHUB_USERNAME"
          test -n "$DAGSHUB_TOKEN"
          dvc remote modify --local origin access_key_id "$DAGSHUB_USERNAME"
          dvc remote modify --local origin secret_access_key "$DAGSHUB_TOKEN"

      - name: Restore versioned datasets and stage outputs
        run: dvc pull

      - name: Reproduce model and statistical validation stages
        run: |
          dvc repro early_warning synthetic_baseline
          dvc repro model_quality oulad_statistical_validation synthetic_statistical_validation

      - name: Verify formal model-quality assessment completed
        run: |
          python -c "import json; from pathlib import Path; report=json.loads(Path('artifacts/validation/model_quality/summary.json').read_text()); assert report['assessment_executed'] is True; assert report['track_count'] == 3; assert report['release_decision'] in {'approved', 'blocked'}; assert all(item['assessment_executed'] for item in report['tracks'].values())"

      - name: Verify committed DVC metadata is reproducible
        run: git diff --exit-code -- dvc.lock

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-validation-${{ github.run_id }}
          path: |
            artifacts/validation/
            artifacts/metrics/early_warning_metrics.json
            artifacts/metrics/synthetic_baseline_metrics.json
          if-no-files-found: error
          retention-days: 90
