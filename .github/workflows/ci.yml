name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest
        run: |
          ruff check src pipeline tests
          pytest -v

      - name: Generate synthetic smoke dataset
        run: |
          python -m src.simulation.simulator \
            --output-dir .ci-data/synthetic \
            --students 100 \
            --terms 2 \
            --weeks-per-term 8 \
            --overwrite

      - name: Run synthetic baseline smoke test
        run: |
          python -m pipeline.synthetic_baseline_pipeline \
            --data-dir .ci-data/synthetic \
            --metrics-output .ci-output/synthetic_metrics.json \
            --model-dir .ci-output/models \
            --cutoffs-days 30
