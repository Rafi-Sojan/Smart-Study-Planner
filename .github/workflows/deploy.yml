name: Deploy Smart Study Planner

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable 40-character Git commit SHA published to GHCR"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  DEPLOY_NAMESPACE: smart-study-planner
  MODEL_URI: ${{ vars.MODEL_URI }}
  MODEL_THRESHOLD: ${{ vars.MODEL_THRESHOLD }}
  MODEL_CATALOG_JSON: ${{ vars.MODEL_CATALOG_JSON }}
  DEFAULT_MODEL_ID: ${{ vars.DEFAULT_MODEL_ID }}
  APP_HOST: ${{ vars.APP_HOST }}
  INGRESS_CLASS_NAME: ${{ vars.INGRESS_CLASS_NAME }}
  CERT_MANAGER_CLUSTER_ISSUER: ${{ vars.CERT_MANAGER_CLUSTER_ISSUER }}
  TLS_SECRET_NAME: ${{ vars.TLS_SECRET_NAME }}
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  API_KEY: ${{ secrets.API_KEY }}
  WEB_AUTH_USERNAME: ${{ secrets.WEB_AUTH_USERNAME }}
  WEB_AUTH_PASSWORD_HASH: ${{ secrets.WEB_AUTH_PASSWORD_HASH }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

jobs:
  deploy:
    name: Verify and deploy to Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable release configuration
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production deployment must be dispatched from the main branch" >&2
            exit 1
          }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "image_tag must be the full lowercase 40-character commit SHA" >&2
            exit 1
          }
          git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null || {
            echo "image_tag does not identify a commit in this repository" >&2
            exit 1
          }
          git merge-base --is-ancestor "$IMAGE_TAG" origin/main || {
            echo "image_tag must identify a commit reachable from main" >&2
            exit 1
          }
          for name in KUBE_CONFIG_DATA APP_HOST TLS_SECRET_NAME \
            MLFLOW_TRACKING_URI MLFLOW_TRACKING_USERNAME MLFLOW_TRACKING_PASSWORD \
            API_KEY WEB_AUTH_USERNAME WEB_AUTH_PASSWORD_HASH SESSION_SECRET \
            GHCR_USERNAME GHCR_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production value is missing: $name" >&2
              exit 1
            fi
          done
          if [[ -n "$MODEL_CATALOG_JSON" ]]; then
            test -n "$DEFAULT_MODEL_ID" || {
              echo "DEFAULT_MODEL_ID is required with MODEL_CATALOG_JSON" >&2
              exit 1
            }
          else
            for name in MODEL_URI MODEL_THRESHOLD; do
              if [[ -z "${!name:-}" ]]; then
                echo "Required single-model value is missing: $name" >&2
                exit 1
              fi
            done
            [[ "$MODEL_URI" =~ ^models:/[^/@]+/[0-9]+$ ]] || {
              echo "MODEL_URI must pin an immutable numeric registry version" >&2
              exit 1
            }
          fi
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "APP_HOST is not a valid DNS hostname" >&2
            exit 1
          }
          [[ "$TLS_SECRET_NAME" =~ ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$ ]] || {
            echo "TLS_SECRET_NAME is not a valid Kubernetes name" >&2
            exit 1
          }
          [[ ${#SESSION_SECRET} -ge 32 ]] || {
            echo "SESSION_SECRET must contain at least 32 characters" >&2
            exit 1
          }
          [[ "$WEB_AUTH_PASSWORD_HASH" =~ ^pbkdf2_sha256:[0-9]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$ ]] || {
            echo "WEB_AUTH_PASSWORD_HASH is not a supported PBKDF2 verifier" >&2
            exit 1
          }
          ingress_class="${INGRESS_CLASS_NAME:-nginx}"
          cluster_issuer="${CERT_MANAGER_CLUSTER_ISSUER:-letsencrypt-prod}"
          for value_name in ingress_class cluster_issuer; do
            value="${!value_name}"
            [[ "$value" =~ ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$ ]] || {
              echo "$value_name is not a valid Kubernetes name" >&2
              exit 1
            }
          done
          echo "INGRESS_CLASS_NAME=$ingress_class" >> "$GITHUB_ENV"
          echo "CERT_MANAGER_CLUSTER_ISSUER=$cluster_issuer" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
          echo "APP_SECRET_NAME=smart-study-planner-release-${IMAGE_TAG:0:12}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve immutable release image digests
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          api_tag_ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          web_tag_ref="${WEB_IMAGE_REPOSITORY}:${IMAGE_TAG}"

          docker buildx imagetools inspect "$api_tag_ref" \
            > deployment-evidence/api-image-inspect.txt
          docker buildx imagetools inspect "$web_tag_ref" \
            > deployment-evidence/web-image-inspect.txt

          api_digest="$(awk '$1 == "Digest:" {print $2; exit}' deployment-evidence/api-image-inspect.txt)"
          web_digest="$(awk '$1 == "Digest:" {print $2; exit}' deployment-evidence/web-image-inspect.txt)"
          for digest_name in api_digest web_digest; do
            digest="${!digest_name}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Could not resolve a valid immutable digest for $digest_name" >&2
              exit 1
            }
          done

          echo "API_IMAGE_DIGEST=$api_digest" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_DIGEST=$web_digest" >> "$GITHUB_ENV"
          echo "API_IMAGE_REFERENCE=${IMAGE_REPOSITORY}@${api_digest}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_REFERENCE=${WEB_IMAGE_REPOSITORY}@${web_digest}" >> "$GITHUB_ENV"
          {
            echo "### Verified release images"
            echo "- API: \`${IMAGE_REPOSITORY}@${api_digest}\`"
            echo "- Web: \`${WEB_IMAGE_REPOSITORY}@${web_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install registry verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Verify registered model and artifact
        run: |
          mkdir -p deployment-evidence
          if [[ -n "$MODEL_CATALOG_JSON" ]]; then
            python -m pipeline.verify_model_catalog \
              --output deployment-evidence/registry-verification.json
            resolved_version="$(python -c 'import json; r=json.load(open("deployment-evidence/registry-verification.json", encoding="utf-8")); d=next(m for m in r["models"] if m["model_id"] == r["default_model_id"])["verification"]; print(d["name"] + "/" + str(d["version"]))')"
            resolved_threshold="$(python -c 'import json; r=json.load(open("deployment-evidence/registry-verification.json", encoding="utf-8")); d=next(m for m in r["models"] if m["model_id"] == r["default_model_id"])["verification"]; print(d["operating_threshold"])')"
          else
            python -m pipeline.verify_registered_model \
              --model-uri "$MODEL_URI" \
              --expected-threshold "$MODEL_THRESHOLD" \
              --output deployment-evidence/registry-verification.json
            resolved_version="$(python -c 'import json; r=json.load(open("deployment-evidence/registry-verification.json", encoding="utf-8")); print(r["name"] + "/" + str(r["version"]))')"
            resolved_threshold="$MODEL_THRESHOLD"
          fi
          echo "RESOLVED_MODEL_VERSION=$resolved_version" >> "$GITHUB_ENV"
          echo "RESOLVED_MODEL_THRESHOLD=$resolved_threshold" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure and validate cluster credentials
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
          kubectl get namespace "$DEPLOY_NAMESPACE" >/dev/null
          for permission in \
            "create deployments.apps" "patch deployments.apps" \
            "create secrets" "patch secrets" \
            "create services" "patch services" \
            "create ingresses.networking.k8s.io" "patch ingresses.networking.k8s.io" \
            "create horizontalpodautoscalers.autoscaling" "patch horizontalpodautoscalers.autoscaling" \
            "create poddisruptionbudgets.policy" "patch poddisruptionbudgets.policy" \
            "create networkpolicies.networking.k8s.io" "patch networkpolicies.networking.k8s.io" \
            "create serviceaccounts" "patch serviceaccounts"; do
            read -r verb resource <<< "$permission"
            kubectl auth can-i "$verb" "$resource" --namespace "$DEPLOY_NAMESPACE" | grep -qx yes
          done

      - name: Synchronize production secrets
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$DEPLOY_NAMESPACE" create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$DEPLOY_NAMESPACE" create secret generic "$APP_SECRET_NAME" \
            --from-literal=MODEL_URI="$MODEL_URI" \
            --from-literal=MODEL_THRESHOLD="$MODEL_THRESHOLD" \
            --from-literal=MODEL_VERSION="$RESOLVED_MODEL_VERSION" \
            --from-literal=MODEL_CATALOG_JSON="$MODEL_CATALOG_JSON" \
            --from-literal=DEFAULT_MODEL_ID="$DEFAULT_MODEL_ID" \
            --from-literal=MLFLOW_TRACKING_URI="$MLFLOW_TRACKING_URI" \
            --from-literal=MLFLOW_TRACKING_USERNAME="$MLFLOW_TRACKING_USERNAME" \
            --from-literal=MLFLOW_TRACKING_PASSWORD="$MLFLOW_TRACKING_PASSWORD" \
            --from-literal=API_KEY="$API_KEY" \
            --from-literal=WEB_AUTH_USERNAME="$WEB_AUTH_USERNAME" \
            --from-literal=WEB_AUTH_PASSWORD_HASH="$WEB_AUTH_PASSWORD_HASH" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --from-literal=ALLOWED_HOSTS="$APP_HOST" \
            --dry-run=client -o json \
            | python -c 'import json,sys; secret=json.load(sys.stdin); secret["immutable"]=True; json.dump(secret,sys.stdout)' \
            | kubectl apply -f -

      - name: Render and apply production manifests
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          rendered_manifest="deployment-evidence/rendered-manifest.yaml"
          kubectl kustomize deploy/kubernetes \
            | sed \
                -e "s#ghcr.io/example/smart-study-planner:latest#${API_IMAGE_REFERENCE}#g" \
                -e "s#ghcr.io/example/smart-study-planner-web:latest#${WEB_IMAGE_REFERENCE}#g" \
                -e "s#planner.example.edu#${APP_HOST}#g" \
                -e "s#TLS_SECRET_PLACEHOLDER#${TLS_SECRET_NAME}#g" \
                -e "s#INGRESS_CLASS_PLACEHOLDER#${INGRESS_CLASS_NAME}#g" \
                -e "s#CLUSTER_ISSUER_PLACEHOLDER#${CERT_MANAGER_CLUSTER_ISSUER}#g" \
                -e "s#APP_SECRET_PLACEHOLDER#${APP_SECRET_NAME}#g" \
            > "$rendered_manifest"
          kubectl apply -f "$rendered_manifest"
          kubectl -n "$DEPLOY_NAMESPACE" annotate deployment/smart-study-planner-api \
            deployment.smart-study-planner/model-version="$RESOLVED_MODEL_VERSION" \
            deployment.smart-study-planner/model-threshold="$RESOLVED_MODEL_THRESHOLD" \
            deployment.smart-study-planner/image-tag="$IMAGE_TAG" \
            deployment.smart-study-planner/image-digest="$API_IMAGE_DIGEST" \
            --overwrite
          kubectl -n "$DEPLOY_NAMESPACE" annotate deployment/smart-study-planner-web \
            deployment.smart-study-planner/image-tag="$IMAGE_TAG" \
            deployment.smart-study-planner/image-digest="$WEB_IMAGE_DIGEST" \
            --overwrite
          kubectl -n "$DEPLOY_NAMESPACE" rollout status \
            deployment/smart-study-planner-api --timeout=300s
          kubectl -n "$DEPLOY_NAMESPACE" rollout status \
            deployment/smart-study-planner-web --timeout=300s

      - name: Verify TLS and public readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if kubectl -n "$DEPLOY_NAMESPACE" get secret "$TLS_SECRET_NAME" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          kubectl -n "$DEPLOY_NAMESPACE" get secret "$TLS_SECRET_NAME" >/dev/null
          if kubectl -n "$DEPLOY_NAMESPACE" get certificate "$TLS_SECRET_NAME" >/dev/null 2>&1; then
            kubectl -n "$DEPLOY_NAMESPACE" wait \
              --for=condition=Ready "certificate/${TLS_SECRET_NAME}" --timeout=300s
          fi
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://${APP_HOST}/readyz"

      - name: Capture deployment evidence
        if: always()
        shell: bash
        run: |
          mkdir -p deployment-evidence
          kubectl -n "$DEPLOY_NAMESPACE" get deployment,replicaset,pod,service,ingress,hpa,pdb \
            -o wide > deployment-evidence/resource-status.txt 2>&1 || true
          kubectl -n "$DEPLOY_NAMESPACE" rollout history deployment/smart-study-planner-api \
            > deployment-evidence/rollout-history.txt 2>&1 || true
          kubectl -n "$DEPLOY_NAMESPACE" rollout history deployment/smart-study-planner-web \
            > deployment-evidence/web-rollout-history.txt 2>&1 || true
          kubectl -n "$DEPLOY_NAMESPACE" get pods \
            -l 'app.kubernetes.io/name in (smart-study-planner-api,smart-study-planner-web)' \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.containerStatuses[0].imageID}{"\n"}{end}' \
            > deployment-evidence/image-digests.txt 2>&1 || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-evidence-${{ inputs.image_tag }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 90
