name: Deploy inference service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to deploy, normally a commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOY_NAMESPACE: smart-study-planner

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster credentials
        shell: bash
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          case "$IMAGE_TAG" in
            ''|*[!A-Za-z0-9._-]*) echo "Invalid image tag" >&2; exit 1 ;;
          esac
          rendered_manifest="$(mktemp)"
          kubectl kustomize deploy/kubernetes \
            | sed "s#ghcr.io/example/smart-study-planner:latest#ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}#g" \
            > "$rendered_manifest"
          kubectl apply -f "$rendered_manifest"
          kubectl -n "$DEPLOY_NAMESPACE" rollout status deployment/smart-study-planner-api --timeout=180s
